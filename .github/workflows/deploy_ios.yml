name: Deploy iOS to App Store Connect

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Compilar e Enviar para TestFlight / App Store
    runs-on: macos-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Dependências
        run: npm install

      - name: Gerar plataforma iOS (Capacitor/Ionic)
        run: npx cap add ios || npx cap sync ios

      - name: Configurar Ruby e Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: false

      - name: Instalar Fastlane globalmente (Alternativa sem Gemfile)
        run: |
          sudo gem install fastlane -NV

      - name: Executar Build e Upload para TestFlight via Fastlane
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          cd ios
          # Executa o fastlane diretamente sem depender do Bundler/Gemfile local
          fastlane release
