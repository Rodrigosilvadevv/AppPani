name: Deploy iOS to App Store Connect

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Compilar e Enviar para TestFlight / App Store
    runs-on: macos-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Dependências
        run: npm install

      - name: Gerar plataforma iOS (Capacitor/Ionic)
        run: npx cap add ios || npx cap sync ios

      - name: Configurar Ruby e Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: false

      - name: Instalar Fastlane globalmente
        run: sudo gem install fastlane -NV

      - name: Criar Fastfile completo automaticamente
        run: |
          mkdir -p ios/fastlane
          cat << 'EOF' > ios/fastlane/Fastfile
          default_platform(:ios)

          platform :ios do
            desc "Submeter build para o TestFlight"
            lane :release do
              # Autenticação oficial via App Store Connect API com variáveis passadas do GitHub Actions
              app_store_connect_api_key(
                key_id: ENV["ASC_KEY_ID"],
                issuer_id: ENV["ASC_ISSUER_ID"],
                key_filepath: ENV["ASC_KEY_FILEPATH"],
                duration: 1200,
                in_house: false
              )

              # Executa o build e o upload para o TestFlight
              upload_to_testflight(
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOF

      - name: Executar Build e Upload para TestFlight via Fastlane
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_FILE"
          
          # Exporta o caminho do ficheiro para a variável de ambiente global do runner
          echo "ASC_KEY_FILEPATH=$KEY_FILE" >> $GITHUB_ENV
          
          cd ios
          fastlane release
