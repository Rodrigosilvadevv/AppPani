name: Deploy iOS to App Store Connect

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Compilar e Enviar para TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Dependências
        run: npm install

      - name: Compilar Aplicação Web
        run: npm run build --if-present

      - name: Adicionar e Sincronizar Capacitor iOS
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
          echo "--- Estrutura da pasta ios ---"
          find ios -maxdepth 3 \( -name "*.xcworkspace" -o -name "*.xcodeproj" -o -name "Package.swift" -o -name "Podfile" \) -not -path "*/Pods/*"

      - name: Localizar Workspace do Xcode
        run: |
          cd ios
          WS_PATH=$(find . -name "*.xcworkspace" -not -path "*/Pods/*" -not -path "*/.build/*" -maxdepth 3 | head -n 1 | sed 's|^\./||')
          PROJ_PATH=$(find . -name "*.xcodeproj" -not -path "*/Pods/*" -maxdepth 3 | head -n 1 | sed 's|^\./||')
          echo "IOS_WORKSPACE=$WS_PATH" >> $GITHUB_ENV
          echo "IOS_PROJECT=$PROJ_PATH" >> $GITHUB_ENV
          echo "Workspace: $WS_PATH | Project: $PROJ_PATH"

      - name: Configurar Ruby e Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Instalar Fastlane
        run: gem install fastlane -NV

      - name: Criar Esquema Compartilhado do Xcode
        run: |
          cd ios
          ruby -rxcodeproj -e '
            project = Xcodeproj::Project.open(ENV["IOS_PROJECT"])
            puts "Targets: #{project.targets.map(&:name).join(", ")}"
            target = project.targets.find { |t| t.name == "App" } || project.native_targets.first
            puts "Target usado: #{target.name}"
            scheme = Xcodeproj::XCScheme.new
            scheme.add_build_target(target)
            scheme.set_launch_target(target)
            scheme.save_as(project.path, target.name, true)
          '
          echo "--- Esquemas compartilhados ---"
          find . -path "*xcshareddata/xcschemes/*.xcscheme" -not -path "*/Pods/*"

      - name: Descobrir Scheme (diagnóstico)
        run: |
          cd ios
          xcodebuild -version
          if [ -n "$IOS_WORKSPACE" ]; then
            LIST_ARGS="-workspace $IOS_WORKSPACE"
          else
            LIST_ARGS="-project $IOS_PROJECT"
          fi
          echo "--- xcodebuild -list ---"
          xcodebuild -list $LIST_ARGS || true

          SCHEME=$(xcodebuild -list -json $LIST_ARGS 2>/dev/null | ruby -rjson -e '
            j = JSON.parse(STDIN.read)
            s = (j["workspace"] || j["project"])["schemes"] || []
            puts(s.find { |x| x == "App" } || s.reject { |x| x =~ /Pods/ }.first)
          ' || true)

          echo "Scheme detectado: [$SCHEME]"
          if [ -z "$SCHEME" ]; then
            echo "ERRO: nenhum scheme encontrado pelo xcodebuild."
            exit 1
          fi
          echo "IOS_SCHEME=$SCHEME" >> $GITHUB_ENV

      - name: Criar Fastfile
        run: |
          mkdir -p ios/fastlane
          cat << 'EOF' > ios/fastlane/Fastfile
          default_platform(:ios)

          platform :ios do
            desc "Enviar build para o TestFlight"
            lane :release do
              key_id    = ENV["ASC_KEY_ID"]
              issuer_id = ENV["ASC_ISSUER_ID"]
              key_path  = ENV["ASC_KEY_FILEPATH"]
              team_id   = ENV["APPLE_TEAM_ID"]
              build_num = ENV["GITHUB_RUN_NUMBER"] || "1"

              app_store_connect_api_key(
                key_id: key_id,
                issuer_id: issuer_id,
                key_filepath: key_path,
                duration: 1200,
                in_house: false
              )

              signing_args = "-allowProvisioningUpdates " \
                "-authenticationKeyPath #{key_path} " \
                "-authenticationKeyID #{key_id} " \
                "-authenticationKeyIssuerID #{issuer_id}"

              ws = ENV["IOS_WORKSPACE"].to_s
              proj = ENV["IOS_PROJECT"].to_s

              build_args = {
                scheme: ENV["IOS_SCHEME"],
                export_method: "app-store",
                clean: true,
                xcargs: "#{signing_args} DEVELOPMENT_TEAM=#{team_id} CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=#{build_num}",
                export_xcargs: signing_args,
                export_options: {
                  method: "app-store",
                  teamID: team_id,
                  signingStyle: "automatic"
                }
              }
              if ws.empty?
                build_args[:project] = proj
              else
                build_args[:workspace] = ws
              end

              build_ios_app(build_args)

              upload_to_testflight(
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOF

      - name: Executar Fastlane
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_FILE"

          export ASC_KEY_FILEPATH="$KEY_FILE"

          cd ios
          fastlane release
