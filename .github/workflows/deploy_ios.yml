name: Deploy iOS to App Store Connect

on:
  push:
    branches:
      - main # Ajuste para a sua branch de produção

jobs:
  deploy:
    name: Compilar e Enviar para TestFlight / App Store
    runs-on: macos-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar Dependências
        run: npm install

      - name: Configurar Ruby e Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true

      - name: Instalar Dependências do Fastlane
        run: |
          cd ios
          bundle install

      - name: Executar Build e Upload para TestFlight via Fastlane
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          # Criação da chave privada temporária a partir do secret do GitHub
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          
          # Executa o comando do Fastlane para build e submissão
          cd ios
          bundle exec fastlane release
*Verification:* O script executa a compilação no runner macOS e envia o pacote gerado diretamente para a App Store Connect.
</Step>

