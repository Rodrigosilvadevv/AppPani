name: Deploy iOS to App Store Connect

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Compilar e Enviar para TestFlight / App Store
    runs-on: macos-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar Dependências
        run: npm install

      - name: Gerar plataforma iOS (Capacitor/Ionic)
        run: npx cap add ios || npx cap sync ios
        # Nota: Se for um projeto puramente nativo em React Native sem Capacitor, remova este passo e certifique-se de que enviou a pasta ios para o Git.

      - name: Configurar Ruby e Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true

      - name: Instalar Dependências do Fastlane
        run: |
          cd ios
          bundle install

      - name: Executar Build e Upload para TestFlight via Fastlane
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          cd ios
          bundle exec fastlane release
