name: Deploy iOS to App Store Connect

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Compilar e Enviar para TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Dependências
        run: npm install

      - name: Compilar Aplicação Web
        run: npm run build --if-present

      - name: Adicionar e Sincronizar Capacitor iOS
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
          echo "--- Estrutura da pasta ios ---"
          find ios -maxdepth 3 \( -name "*.xcworkspace" -o -name "*.xcodeproj" -o -name "Package.swift" -o -name "Podfile" \) -not -path "*/Pods/*"

      - name: Localizar Projeto e Scheme
        run: |
          cd ios
          WS_PATH=$(find . -maxdepth 3 -name "*.xcworkspace" -not -path "*/Pods/*" -not -path "*/.build/*" -not -path "*/xcuserdata/*" | head -n 1 | sed 's|^\./||')
          PROJ_PATH=$(find . -maxdepth 3 -name "*.xcodeproj" -not -path "*/Pods/*" | head -n 1 | sed 's|^\./||')
          echo "Workspace: [$WS_PATH] | Project: [$PROJ_PATH]"

          if [ -n "$WS_PATH" ]; then
            BUILD_FLAG="-workspace"
            BUILD_PATH="$WS_PATH"
          else
            BUILD_FLAG="-project"
            BUILD_PATH="$PROJ_PATH"
          fi

          xcodebuild -version
          echo "--- xcodebuild -list ---"
          xcodebuild -list $BUILD_FLAG "$BUILD_PATH"

          SCHEME=$(xcodebuild -list -json $BUILD_FLAG "$BUILD_PATH" | ruby -rjson -e '
            j = JSON.parse(STDIN.read)
            s = (j["workspace"] || j["project"])["schemes"] || []
            puts(s.find { |x| x == "App" } || s.reject { |x| x =~ /Pods/ }.first)
          ')

          echo "Scheme detectado: [$SCHEME]"
          if [ -z "$SCHEME" ]; then
            echo "ERRO: nenhum scheme encontrado."
            exit 1
          fi

          echo "BUILD_FLAG=$BUILD_FLAG" >> $GITHUB_ENV
          echo "BUILD_PATH=$BUILD_PATH" >> $GITHUB_ENV
          echo "IOS_SCHEME=$SCHEME" >> $GITHUB_ENV

      - name: Preparar Chave da App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_FILE"
          echo "ASC_KEY_FILE=$KEY_FILE" >> $GITHUB_ENV

      - name: Gerar Archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios
          xcodebuild archive \
            $BUILD_FLAG "$BUILD_PATH" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_FILE" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Exportar e Enviar para o TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_FILE" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
