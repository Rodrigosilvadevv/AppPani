name: Deploy iOS to App Store Connect

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Compilar e Enviar para TestFlight / App Store
    runs-on: macos-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Dependências
        run: npm install

      - name: Compilar Aplicação Web (Ionic/Vite/React)
        run: npm run build --if-present

      - name: Adicionar e Sincronizar Capacitor iOS
        run: npx cap add ios || npx cap sync ios

      - name: Forçar Criação do Esquema Partilhado para o Xcode
        run: |
          cd ios
          WS_PATH=$(find . -name "*.xcworkspace" -maxdepth 3 | head -n 1 | sed 's|^\./||')
