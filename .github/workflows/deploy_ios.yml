name: Deploy iOS to App Store Connect

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Compilar e Enviar para TestFlight / App Store
    runs-on: macos-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Dependências
        run: npm install

      - name: Compilar Aplicação Web (Ionic/Vite/React)
        run: npm run build --if-present

      - name: Adicionar e Sincronizar Capacitor iOS
        run: npx cap add ios || npx cap sync ios

      - name: Partilhar Esquemas do Xcode Automaticamente
        run: |
          # Assegura que a pasta xcshareddata existe para o scheme ser lido sem erros
          cd ios
          if [ -d "App.xcodeproj" ]; then
            mkdir -p "App.xcodeproj/xcshareddata/xcschemes"
            if [ -d "App.xcodeproj/xcuserdata" ]; then
              cp -R "App.xcodeproj/xcuserdata"/*/xcschemes/*.xcscheme "App.xcodeproj/xcshareddata/xcschemes/" 2>/dev/null || true
            fi
          fi
          cd ..

      - name: Configurar Ruby e Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Instalar Fastlane globalmente
        run: sudo gem install fastlane -NV

      - name: Criar Fastfile com caminhos diretos do Capacitor
        run: |
          mkdir -p ios/fastlane
          cat << 'EOF' > ios/fastlane/Fastfile
          default_platform(:ios)

          platform :ios do
            desc "Submeter build para o TestFlight"
            lane :release do
              app_store_connect_api_key(
                key_id: ENV["ASC_KEY_ID"],
                issuer_id: ENV["ASC_ISSUER_ID"],
                key_filepath: ENV["ASC_KEY_FILEPATH"],
                duration: 1200,
                in_house: false
              )

              # Caminho estático padrão do Capacitor para workspace e scheme
              build_ios_app(
                workspace: "App/App.xcworkspace",
                scheme: "App",
                export_method: "app-store",
                skip_codesigning: false
              )

              upload_to_testflight(
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOF

      - name: Executar Fastfile via Fastlane
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_FILE"
          
          export ASC_KEY_ID="$ASC_KEY_ID"
          export ASC_ISSUER_ID="$ASC_ISSUER_ID"
          export ASC_KEY_FILEPATH="$KEY_FILE"
          
          cd ios
          fastlane release
